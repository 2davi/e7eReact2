<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <title>Page Title</title>
</head>
<body>
  <script>
    for(let i=0; i<30; i++) {
      document.write(`<h1>상진 만만세${i+1}</h1>`);
    }

    setTimeout(() => window.scrollTo(0,0), 100);
    // window.scrollTo(0, 0);  //크롬은 안 올라감!

    // scrollTop + clientHeight == scrollHeight이면, 스크롤을 끝까지 내린 것임!!
    window.onscroll = function () {
      // console.log("체킁: scrollTOP",    document.documentElement.scrollTop);
      // console.log("체킁: clientHeight", document.documentElement.clientHeight);
      // console.log("체킁: scrollHeight", document.documentElement.scrollHeight);
      // console.log("=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=+=")

      let scrollTop = document.documentElement.scrollTop;
      let clientHeight = document.documentElement.clientHeight;
      let scrollHeight = document.documentElement.scrollHeight;
      let tunning = 100;
      if((scrollTop + clientHeight) >= (scrollHeight - tunning)) {
        for(let i=0; i<10; i++) {
          let h1Tag = document.createElement("h1");
          h1Tag.innerHTML = `태수 만만세${i}`;
          document.body.appendChild(h1Tag);
        }
      }
    }

  </script>
</body>
</html>
